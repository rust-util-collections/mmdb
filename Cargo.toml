[package]
name = "mmdb"
version = "4.3.7"
edition = "2024"
description = "The storage engine behind vsdb — a pure-Rust LSM-Tree key-value store"
license = "MIT"
authors = ["hui.fan@mail.ru"]
repository = "https://github.com/rust-util-collections/mmdb"
homepage = "https://github.com/rust-util-collections/mmdb"
documentation = "https://docs.rs/mmdb"
keywords = ["rocksdb", "leveldb", "kv", "database", "db"]
categories = ["database-implementations"]
readme = "README.md"
exclude = [".github/"]

[dependencies]
crc32fast = "1.5.3"
lz4_flex = "0.14.0"
zstd = "0.14.3"
moka = { version = "0.12.16", features = ["sync"] }
parking_lot = "0.13.0"
tracing = "0.1.44"
arc-swap = "1.9.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
mmdb = { path = ".", features = ["test-utils"] }
tempfile = "3.27.0"
proptest = "1.12.0"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[features]
default = []
test-utils = []  # Exposes test helpers like DB::simulate_crash()
