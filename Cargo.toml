[package]
name = "mmdb"
version = "6.0.2"
edition = "2024"
description = "The storage engine behind vsdb — a pure-Rust LSM-Tree key-value store"
license = "MIT"
authors = ["hui.fan@mail.ru"]
repository = "https://github.com/rust-util-collections/mmdb"
documentation = "https://docs.rs/mmdb"
keywords = ["rocksdb", "leveldb", "kv", "database", "db"]
categories = ["database-implementations"]
readme = "README.md"
exclude = [".github/"]

[dependencies]
smallvec = "1.16.6"
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_64"] }
crc32fast = "1.5.6"
lz4_flex = "0.14.2"
zstd = "0.14.5"
moka = { version = "0.12.16", features = ["sync"] }
parking_lot = "0.13.0"
tracing = "0.1.44"
arc-swap = "1.9.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
mmdb = { path = ".", features = ["test-utils"] }
tempfile = "3.27.0"
proptest = "1.12.0"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[features]
default = []
bench-metrics = []  # Optional diagnostic instrumentation for engine profiles
test-utils = []  # Exposes test helpers like DB::simulate_crash()

[[bench]]
name = "read_write_profile"
harness = false

[[bench]]
name = "engine_profile"
harness = false

[[bench]]
name = "l0_profile"
harness = false
required-features = ["bench-metrics"]

[[bench]]
name = "grouped_reads"
harness = false
