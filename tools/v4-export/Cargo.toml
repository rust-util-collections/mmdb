[package]
name = "mmdb-v4-export"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
v4 = { package = "mmdb", version = "=4.3.15" }
v5 = { package = "mmdb", path = "../.." }
tempfile = "3.27.0"

[target.'cfg(not(target_os = "redox"))'.dependencies]
renamest = "0.1.3"

[target.'cfg(target_os = "redox")'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }
