name: CI

on:
  push:
    branches: [master, v6]
  pull_request:
    branches: [master, v6]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --lib -- -D warnings
      - run: cargo clippy --lib --features bench-metrics -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features bench-metrics -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --features bench-metrics

  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test
            runner: ubuntu-latest
          - name: Test (AArch64)
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The read-only acceptance test traces syscalls; it must not skip in CI.
      - run: sudo apt-get update && sudo apt-get install -y strace
      - run: cargo test --lib
      - run: cargo test --lib --features bench-metrics
      - run: cargo test --doc
      - run: cargo test --test crash_recovery
      - run: cargo test --test e2e_scenarios
      - run: cargo test --test integration
      - run: cargo test --test proptest_db
      - run: cargo test --test bidi_debug
      - run: cargo test --test lazy_delete
      - run: cargo test --test shared_cache
      - run: cargo test --test grouped_reads
      - run: cargo test --test read_only
      # scale_profile is profiling-only and intentionally excluded.

  bench-compile:
    name: Bench Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --benches --features bench-metrics
